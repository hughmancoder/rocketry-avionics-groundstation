[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:stm32l433]
platform = ststm32
board = nucleo_l433rc_p
board_build.mcu = stm32l433ccu6
framework = stm32cube
; Use a modern GCC ARM toolchain with native Apple Silicon (darwin_arm64) support.
; Avoids "Bad CPU type in executable" errors on Apple Silicon Macs without Rosetta 2.
platform_packages = 
    toolchain-gccarmnoneeabi@~1.120301.0

; Define where the include files are located
build_flags = 
    -I Core/Inc
    -D STM32L433xx
    -Wl,-Map="${BUILD_DIR}/firmware.map"

monitor_speed = 115200

; Custom OpenOCD upload command:
; The default Nucleo config (board/st_nucleo_l4.cfg) expects a physical NRST (hardware reset) line.
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/tool-openocd/bin/openocd -d2 -s $PROJECT_PACKAGES_DIR/tool-openocd/openocd/scripts -f board/st_nucleo_l4.cfg -c "adapter speed 1800" -c "reset_config none" -c "program {$SOURCE} 0x08000000 verify reset; shutdown;"

; Custom OpenOCD debug configuration for custom PCB without NRST pin
debug_tool = custom
debug_server = 
    ${platformio.packages_dir}/tool-openocd/bin/openocd
    -s
    ${platformio.packages_dir}/tool-openocd/openocd/scripts
    -f
    board/st_nucleo_l4.cfg
    -c
    adapter speed 1800
    -c
    reset_config none
debug_init_break = tbreak main
debug_extra_cmds = 
    set mem inaccessible-by-default off

